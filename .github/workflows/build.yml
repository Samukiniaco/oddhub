name: Build Ports

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build all ports
        run: python tools/build_all.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ports
          path: dist/*.zip